<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Petisbar Teodoro</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <img class="login-logo" src="../assets/petisbar-teodoro-logo.jpg" alt="Petisbar Teodoro">
      <div>
        <span class="login-eyebrow">Sistema de gestão</span>
        <h1 id="login-title">Acesse o ERP</h1>
        <p>Use seu usuário individual para continuar.</p>
      </div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">E-mail</label>
          <input class="form-input" id="login-email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Senha</label>
          <input class="form-input" id="login-password" name="password" type="password" autocomplete="current-password" minlength="8" required>
        </div>
        <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
        <button class="btn btn-primary login-submit" id="login-submit" type="submit">Entrar</button>
      </form>
    </section>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
