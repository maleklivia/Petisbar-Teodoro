<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta — Petisbar Teodoro</title><link rel="stylesheet" href="../css/cardapio.css?v=20261008-5"></head><body><main class="store-main account-main"><a href="../cardapio.html">← Voltar ao cardápio</a><h1>Minha conta</h1><section id="account-login" class="store-panel"><div><strong>Entrar por e-mail</strong><span>Enviaremos um código de seis dígitos.</span></div><form id="login-request" class="checkout-form"><label>E-mail<input name="email" type="email" required autocomplete="email"></label><label>Nome (no primeiro acesso)<input name="name" autocomplete="name"></label><button class="checkout-button" type="submit">Enviar código</button></form><form id="login-verify" class="checkout-form hidden"><label>Código recebido<input name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code"></label><button class="checkout-button" type="submit">Entrar</button></form><p id="login-message" role="status"></p></section><section id="account-content" class="hidden"><div class="account-toolbar"><div><strong id="account-name"></strong><span id="account-email"></span></div><button id="logout" class="account-button" type="button">Sair</button></div><section id="account-orders" class="store-panel"><strong>Meus pedidos</strong><span>Carregando histórico…</span></section><section id="account-detail" class="store-panel hidden"></section></section></main><script src="../js/minha-conta.js?v=20261008-1"></script></body></html>
