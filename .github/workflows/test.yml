name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: petisbar_test
          POSTGRES_USER: petisbar
          POSTGRES_PASSWORD: petisbar-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petisbar -d petisbar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql://petisbar:petisbar-test-password@localhost:5432/petisbar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
